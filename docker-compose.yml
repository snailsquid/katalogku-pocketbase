volumes:
  product_data:   # database & file milik product-service
  account_data:   # database & file milik account-service

services:
  product-service:          # PocketBase #1: koleksi products
    build: ./pocketbase
    restart: unless-stopped
    volumes:
      - product_data:/pb_data
    ports:
      - "${PRODUCT_PORT:-8091}:8090"         # dashboard: http://IP_SERVER:8091/_/

  account-service:          # PocketBase #2: users + favorites
    build: ./pocketbase
    restart: unless-stopped
    volumes:
      - account_data:/pb_data
    ports:
      - "${ACCOUNT_PORT:-8092}:8090"         # dashboard: http://IP_SERVER:8092/_/

  gateway:                  # satu pintu masuk API
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - product-service
      - account-service

  tunnel:                   # opsional: Cloudflare Tunnel
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    depends_on:
      - gateway
    profiles: ["tunnel"]
